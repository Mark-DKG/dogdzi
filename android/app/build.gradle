plugins {
    id "com.android.application"
}

// Release signing comes from the CI environment (GitHub secrets). The key is
// never committed: this repository is public.
def keystorePath = System.getenv("DOGDZI_KEYSTORE_PATH")
def keystorePassword = System.getenv("DOGDZI_KEYSTORE_PASSWORD")

android {
    namespace "com.ninedevs.dogdzi"
    compileSdk 35

    defaultConfig {
        applicationId "com.ninedevs.dogdzi"
        minSdk 21
        targetSdk 35
        versionCode((System.getenv("DOGDZI_VERSION_CODE") ?: "1") as int)
        versionName(System.getenv("DOGDZI_VERSION_NAME") ?: "1.0.0")
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storeType "pkcs12"
                storePassword keystorePassword
                keyAlias "dogdzi"
                keyPassword keystorePassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
